[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reasoning-mapper"
version = "0.1.0"
description = "Extract an expert's reasoning approaches from their own email, documents and think-aloud sessions, and write them as orchestrated Claude skills."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tucuxi, Inc." }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
pst = ["libpff-python>=20231205"]
docs = ["python-docx>=1.1", "python-pptx>=0.6.23", "pypdf>=4.0"]
anthropic = ["anthropic>=0.40"]
audio = ["faster-whisper>=1.0"]
all = ["reasoning-mapper[pst,docs,anthropic,audio]"]
dev = ["pytest>=8.0", "reasoning-mapper[docs]"]

[project.scripts]
rmap = "reasoning_mapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_mapper"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "reasoning_mapper/catalog"

[tool.pytest.ini_options]
testpaths = ["tests"]
