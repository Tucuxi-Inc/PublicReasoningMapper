# Pattern map. Edit freely: `rmap draft` and `rmap link` only fill empty fields.
# expert_label is how skills refer to the person; keep it a role, not a name.
expert_label: the incident commander
patterns:
- id: incident-commander-ask-what-changed
  tier: 1
  name: Ask what changed
  description: Begin diagnosis by asking what changed shortly before the problem appeared, and suspect
    that change first.
  when_to_apply:
  - a sudden regression or new failure
  - a resource starts behaving differently
  - a small problem keeps recurring
  steps:
  - List deploys, configuration pushes, jobs and vendor changes in the window before the problem started.
  - Suspect the most recent relevant change first.
  - For recurring events, compare what changed before each occurrence.
  - Look at what is causing the symptom, not at the symptom itself.
  quality_indicators:
  - the change log was checked before diagnostic tools were opened
  - a recurring problem was tested for a common preceding change
  failure_modes:
  - starting with deep diagnosis of the symptom while the recent change goes unexamined
  - assuming a reviewed change cannot be the cause
  example: Checkout latency jumps minutes after a rate-limiter configuration deploy; the incident commander
    asks what changed this morning before anyone opens a profiler.
  notes: Comparing what changed before each recurrence is the same habit applied across events.
  orchestrated_by:
  - incident-commander-size-the-response-to-harm-and-reversibility
  - incident-commander-stabilise-first-diagnose-second
  co_occurs_with:
  - incident-commander-size-the-response-to-harm-and-reversibility
  - incident-commander-stabilise-first-diagnose-second
  - incident-commander-promise-the-next-update-not-the-fix
  aligns_with:
  - method-of-difference
  beyond_general: The habit incorporates specific domain-specific heuristics, such as prioritizing 'recent'
    changes and distinguishing between 'symptoms' and 'causes' to narrow the search space in high-pressure
    environments.
  clusters:
