- id: incident-commander-prefer-the-move-you-can-undo
  tier: 1
  name: Prefer the move you can undo
  description: When choosing between actions under pressure, prefer the one that can be undone quickly,
    and do what is needed beforehand (capturing evidence, rehearsing the rollback) so that undoing stays
    cheap.
  when_to_apply:
  - a mitigation is available and the cause is not yet known
  - a tempting action cannot be reversed, such as deleting data
  - a launch relies on a rollback nobody has run
  steps:
  - For each candidate action, ask how quickly and completely it can be undone.
  - Capture the evidence you will need later before acting.
  - Take the reversible action first and watch what it tells you.
  - Treat an untested rollback as the riskiest part of a plan and rehearse it.
  quality_indicators:
  - the first action taken could have been reversed within minutes
  - evidence survived the mitigation
  - the rollback had been exercised before it was needed
  failure_modes:
  - making an irreversible change when tired or rushed
  - rolling back without capturing the state needed for diagnosis
  example: Paged at night for a disk filling up, the incident commander lowers a log level or pauses a
    batch job - both undoable - and refuses to delete files on the primary to buy space.
  notes: Capturing evidence first and rehearsing the rollback are what keep the undo cheap.
  orchestrated_by:
  - incident-commander-size-the-response-to-harm-and-reversibility
  - incident-commander-stabilise-first-diagnose-second
  co_occurs_with:
  - incident-commander-find-who-carries-the-cost
  - incident-commander-price-the-risk-offer-a-cheaper-path
  aligns_with:
  - reversibility-assessment
  - staged-commitment
  beyond_general: The habit adds specific operational safety protocols, such as pre-emptive evidence capture
    and rehearsing rollbacks, to ensure that the 'undo' mechanism is technically viable before it is needed.
  clusters:
  - m03
  - m10
  - m13
  support:
    episodes: 4
    sources:
      think_aloud: 2
      adjustment: 3
