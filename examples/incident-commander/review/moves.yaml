# Review sheet. For each cluster set:
#   decision:   keep | drop | merge      (undecided clusters are ignored)
#   merge_into: <cluster id>             (when decision is merge)
#   name:       what YOU call this habit, in your own words
#   tier:       1 structural   - a core way of analysing (framing, weighing, testing)
#               2 behavioral   - how you apply it in a kind of situation or with people
#               3 orchestration - how you decide WHICH approach a situation needs
#   notes:      anything an apprentice should know that the evidence misses
# Similarities compress: rank by `episodes`, do not threshold coherence into a verdict.
kind: move
embedder: hashing shortlist + model judge
k: 14
distinct_names: 29
mentions: 29
warning: null
clusters:
- id: m01
  decision: keep
  merge_into: null
  name: Ask what changed
  tier: 1
  notes: Comparing what changed before each recurrence is the same habit applied across events.
  episodes: 4
  mentions: 4
  coherence: 0.71
  sources:
    document: 1
    adjustment: 2
    think_aloud: 1
  core:
  - ask what changed recently
  - ask what changed before digging
  - check what changed before each event
  - look at what changed, not the symptom
  sample:
  - look at what changed, not the symptom
  - ask what changed recently
  - ask what changed before digging
  - check what changed before each event
  evidence:
  - move: ask what changed before digging
    step: Pull up the change log before opening diagnostic tools.
    cue: the start of any incident
    quote: The first question is not "what is broken" but "what changed".
  - move: ask what changed recently
    step: Before investigating symptoms, list what changed in the last hour and suspect it first.
    cue: a sudden regression shortly after a deploy
    quote: 'before anyone opens a profiler: what changed this morning?'
  - move: check what changed before each event
    step: Compare the changes that preceded each occurrence to find a common cause.
    cue: recurring incidents
    quote: what changed before each of the three?
  - move: look at what changed, not the symptom
    step: Ask what started writing rather than examining the full disk.
    cue: a growing resource at an odd hour
    quote: I'd look at what's writing, not at the disk.
- id: m02
  decision: keep
  merge_into: null
  name: Find who carries the cost
  tier: 1
  notes: ''
  episodes: 3
  mentions: 3
  coherence: 0.803
  sources:
    think_aloud: 1
    adjustment: 2
  core:
  - identify who carries the cost
  - ask who carries the cost of saying yes
  - who carries the cost if it fails
  sample:
  - ask who carries the cost of saying yes
  - who carries the cost if it fails
  - identify who carries the cost
  evidence:
  - move: ask who carries the cost of saying yes
    step: Look past the requester to everyone else who bears the risk of an exception.
    cue: a request for an exception to a protective rule
    quote: who else carries the cost if I say yes
  - move: identify who carries the cost
    step: Name who bears the cost of each option, especially of delay.
    cue: a proposal to keep the fault live while investigating
    quote: they are the ones carrying the cost of our investigation, not us
  - move: who carries the cost if it fails
    step: For a risky launch, trace who absorbs the failure and when it lands.
    cue: a launch scheduled before a weekend
    quote: those hours land on whoever is on call over the weekend, and the carriers ... absorb the failed
      routes
- id: m03
  decision: keep
  merge_into: null
  name: Prefer the move you can undo
  tier: 1
  notes: Capturing evidence first and rehearsing the rollback are what keep the undo cheap.
  episodes: 3
  mentions: 3
  coherence: 0.724
  sources:
    think_aloud: 2
    adjustment: 1
  core:
  - choose the reversible action first
  - avoid the irreversible move at 2am
  - check whether the change is reversible
  sample:
  - avoid the irreversible move at 2am
  - choose the reversible action first
  - check whether the change is reversible
  evidence:
  - move: avoid the irreversible move at 2am
    step: Refuse actions you cannot undo when tired and under pressure; pause rather than kill.
    cue: temptation to delete files to buy space
    quote: What I would not do at 2am is start deleting files on the primary
  - move: check whether the change is reversible
    step: Let reversibility decide how much risk an exception can carry.
    cue: a change requested on short notice
    quote: If we can roll the database back in minutes, the risk to everyone else is small
  - move: choose the reversible action first
    step: Prefer the action you can undo in minutes over the one you cannot.
    cue: a candidate fix that is a small config rollback
    quote: The rollback is a two-minute change we can undo, so it costs us almost nothing to try it first.
- id: m04
  decision: keep
  merge_into: null
  name: Promise the next update, not the fix
  tier: 2
  notes: The update time is a promise I control; the fix time is not. Never pass on someone else's estimate
    as ours.
  episodes: 3
  mentions: 3
  coherence: 0.793
  sources:
    adjustment: 2
    document: 1
  core:
  - promise next update time, not an eta
  - commit to next update time
  - give next update time instead of eta
  sample:
  - commit to next update time
  - give next update time instead of eta
  - promise next update time, not an eta
  evidence:
  - move: commit to next update time
    step: Tell affected customers when they will next hear from you, regardless of progress.
    cue: customers calling support during an incident
    quote: they will hear from us again at 09:40 whether or not it is fixed
  - move: give next update time instead of ETA
    step: Promise the time of the next update and keep it even if nothing changed.
    cue: communicating during an incident
    quote: Give a time for the next update instead, and keep it even if the update is "no change".
  - move: promise next update time, not an ETA
    step: Commit to when customers will next hear from you rather than when it will be fixed.
    cue: pressure to give customers an ETA
    quote: we will update them by 12:00 whether or not it is fixed
- id: m05
  decision: keep
  merge_into: null
  name: Size the response to harm and reversibility
  tier: 3
  notes: 'Repetition overrides size: three small events are a pattern and get a proper look. Knowing how
    much time you have is part of the sizing.'
  episodes: 3
  mentions: 3
  coherence: 0.733
  sources:
    document: 1
    adjustment: 1
    think_aloud: 1
  core:
  - size review to blast radius and reversibility
  - match process size to harm and reversibility
  - size the escalation to who is affected
  sample:
  - match process size to harm and reversibility
  - size review to blast radius and reversibility
  - size the escalation to who is affected
  evidence:
  - move: match process size to harm and reversibility
    step: Choose ticket, short review or full process from blast radius and reversibility.
    cue: deciding how much incident machinery to use
    quote: 'I size the response on two things: how many people are being hurt right now (blast radius),
      and whether what is happening can be undone'
  - move: size review to blast radius and reversibility
    step: Scale the review effort to how many were hurt and whether the harm could be undone.
    cue: a small, fully recoverable incident
    quote: not every incident gets the same size of review
  - move: size the escalation to who is affected
    step: Page more people only as the number affected or the threshold rises.
    cue: no users affected yet
    quote: So this is not a wake-everyone-up incident.
